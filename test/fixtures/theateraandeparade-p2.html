dan een week lang verandert de IVC Den Bosch weer in een bruisende ontmoetingsplek voor de meest veelbelovende stemmen ter wereld. Na audities in heel Europa, Azië en de Verenigde Staten nemen veertig uitmuntende jonge zangers deel aan de live rondes. De finale in Theater aan de Parade wordt begeleid door het gerenommeerde Nederlandse symfonieorkest Philzuid, onder leiding van Grammy Award-winnende dirigent Karen Kamensek.\u003C\u002Fp\u003E\u003Cp\u003EDit jaar krijgen opera en oratorium evenveel nadruk. Elke zanger treedt daarom tweemaal op tijdens de Main Rounds. Dit biedt u de bijzondere kans om uw favoriete zanger meer dan eens te horen.\u003C\u002Fp\u003E\u003Cp\u003EWinnaars van het IVC-concours bereiken de grootste operapodia ter wereld. Naast een totaal prijzengeld van meer dan €50.000, ontvangen deelnemers persoonlijke feedback van een internationale jury van toonaangevende professionals, onder de bezielende leiding van opera- regisseur Sir David Pountney.\u003C\u002Fp\u003E\u003Cp\u003EOok nemen zij deel aan inspirerende masterclasses en workshops en bouwen zij duurzame artistieke relaties op. Dankzij intensieve begeleiding, mentorschap en gerichte loopbaanondersteuning vormt de IVC voor iedere deelnemer een waardevolle en inspirerende ervaring.\u003C\u002Fp\u003E\u003Cp\u003EWinnaars van het Prinses Christina Concours, met steun van de Bierens Stichting voor de Kunsten, werken in een inspirerende masterclass met countertenor en algemeen &amp; artistiek directeur IVC Andrew Watts. Luister naar de volgende generatie jonge zangers die hier op het podium schitteren.\u003C\u002Fp\u003E\u003Cp\u003E\u003Cstrong\u003EPassepartout\u003C\u002Fstrong\u003E\u003Cbr\u003EWilt u niets missen? Met de IVC Passepartout 2026 volgt u alle deelnemers op de voet en heeft u toegang tot alle activiteiten van vrijdag 2 tot en met zaterdag 10 oktober.\u003C\u002Fp\u003E",startAt:B,endAt:ao,image1:{id:"90073d8a-d50c-423f-84c4-8ce3b27f2843",url:"https:\u002F\u002Fmedia.theateraan t van de dagelijkse drukte. \u003Ci\u003EKoffie bij de Piano\u003C\u002Fi\u003E biedt precies dat moment van rust en aandacht. In een sfeervolle omgeving luister je naar een live pianoconcert, waarbij niet alleen de muziek centraal staat, maar ook de persoon erachter. Elke editie wordt namelijk begeleid door een jonge presentator die de musicus interviewt en zo een persoonlijk inkijkje geeft in diens verhaal en drijfveren.\u003C\u002Fp\u003E\u003Cp\u003EWat deze serie bijzonder maakt, is de directe ontmoeting tussen artiest en publiek. Geen grote afstand of formele setting, maar een warme, nabije ervaring waarin muziek echt kan binnenkomen. Of je nu een doorgewinterde liefhebber bent of gewoon wilt genieten van een inspirerend begin van je zondag: \u003Ci\u003EKoffie bij de Piano\u003C\u002Fi\u003E nodigt uit om even stil te staan en met nieuwe energie weer naar buiten te gaan.\u003Cbr\u003E\u003Cbr\u003E\u003Cstrong\u003EOver David Kooi\u003C\u002Fstrong\u003E\u003Cbr\u003EDavid (2009) is een veelbelovende jonge pianist die sinds 2024 studeert aan de Sweelinck Academie in Amsterdam bij Frank van de Laar. Met zijn energie, verfijning en uitzonderlijke muzikaliteit won hij al diverse prestigieuze prijzen, waaronder De Muziekwedstrijd, het Prinses Christina Concours en het Internationale Steinway Piano Concours. Hij trad op bij Podium Klassiek, in de Spiegelzaal en het Koninklijk Concertgebouw en speelde als solist met verschillende orkesten in binnen- en buitenland. In juni 2026 won David de Nationale Selectie Lions EuroConcours Piano in ’s-Hertogenbosch, waarmee hij Nederland vertegenwoordigt tijdens de Europese Lions muziekwedstrijd Thomas Kuti in Karlsruhe van 21 tot en met 24 oktober.\u003Cbr\u003E\u003Cbr\u003EDe presentatie wordt gedaan door Mylan Tran en de prelude door Aroen Quajnan.&nbsp;\u003C\u002Fp\u003E",startAt:N,endAt:bu,image1:{id:"1d402695-3e4d-4ac4-aa96-75f0852edd59",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fdavid-kooi.jpg?guid=1d402695-3e4d-4ac4-aa96-75f0852edd59",credits:a,altText:a,alignment:"focus-25%-47%"},image2:a,image3:a,image4:a,button:a,genres:[{id:r,name:_}],attributes:[{id:o,name:E,type:{id:i,name:C},fields:{string:d}}],program:{id:844,startAt:N,endAt:bu,price:a,isCanceled:k,hasWaitingList:k,button:{text:P,link:"https:\u002F\u002Ftix.theateraandeparade.nl\u002Fnl\u002Fbuyingflow\u002Ftickets\u002F57561\u002F"},location:{id:u,name:T},attributes:[],prices:[{id:14662,price:z,availability:131,saleStartAt:R,saleEndAt:N,type:{id:c,name:D},rank:{id:c,name:f}},{id:14663,price:z,availability:b,saleStartAt:e,saleEndAt:N,type:{id:o,name:F},rank:{id:c,name:f}},{id:14664,price:z,availability:b,saleStartAt:e,saleEndAt:N,type:{id:s,name:G},rank:{id:c,name:f}},{id:14665,price:z,availability:b,saleStartAt:e,saleEndAt:N,type:{id:t,name:H},rank:{id:c,name:f}},{id:14666,price:z,availability:b,saleStartAt:e,saleEndAt:N,type:{id:I,name:J},rank:{id:c,name:f}},{id:14667,price:z,availability:b,saleStartAt:e,saleEndAt:N,type:{id:r,name:K},rank:{id:c,name:f}},{id:14668,price:z,availability:b,saleStartAt:e,saleEndAt:N,type:{id:n,name:L},rank:{id:c,name:f}}],fields:{breakText:"Pauze, koffie en thee inbegrepen",extraInfo:d}},fields:{inleiding:"\u003Cp\u003E\u003Ci\u003EKoffie bij de Piano\u003C\u002Fi\u003E is al meer dan 25 jaar een geliefde traditie van Theater aan de Parade, waarin aanstormend pianotalent een podium krijgt in een intieme en toegankelijke setting. Tijdens deze concertreeks maak je kennis met veelbelovende jonge musici uit binnen- en buitenland; de topmusici van morgen, van dichtbij beleefd.\u003C\u002Fp\u003E",showFoldoutsInHeader:g,title1:"Inclusief",text1:"\u003Cp\u003E\u003Ci\u003EKoffie bij de Piano\u003C\u002Fi\u003E&nbsp;is inclusief koffie en thee én programmablad.\u003Cstrong\u003E&nbsp;\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E",title2:ad,text2:"\u003Cul\u003E\u003Cli\u003EDe edities van&nbsp;\u003Ci\u003EKoffie bij de Piano&nbsp;\u003C\u002Fi\u003Ekunnen&nbsp;\u003Ci\u003Eniet\u003C\u002Fi\u003E&nbsp;bezocht worden&nbsp;met de Podiumpas.\u003C\u002Fli\u003E\u003Cli\u003E\u003Ca href=\"https:\u002F\u002Fwww.theateraandeparade.nl\u002Fnl\u002Ftheatermaatjes\" target=\"_blank\"\u003E\u003Cstrong\u003ETheatermaatjes\u003C\u002Fstrong\u003E\u003C\u002Fa\u003E\u003Cstrong\u003E:\u003C\u002Fstrong\u003E Kom je voor Theatermaatjes? Schuif gezellig aan bij de Theatermaatjestafel in de rechter nis op de eerste verdieping en ontmoet andere theaterliefhebbers.&nbsp;Je bent vanaf een half uur voor aanvang van de voorstelling van harte welkom. Ook tijdens de pauze en na afloop kun je hier samenkomen.\u003C\u002Fli\u003E\u003C\u002Ful\u003E",title3:"Seizoensoverzicht",text3:"\u003Cp\u003E\u003Ci\u003EKoffie bij de Piano\u003C\u002Fi\u003E vindt plaats op de eerste zondag van de maand om 11:00 uur in Theater aan de Parade. In seizoen 2026\u002F2027 kun je op de volgende data genieten van deze concertreeks (wijzigingen in bezetting voorbehouden):\u003Cbr\u003E&nbsp;\u003C\u002Fp\u003E\u003Cul\u003E\u003Cli\u003EZondag 13 september 2026\u003C\u002Fli\u003E\u003Cli\u003EZondag 11 oktober 2026\u003C\u002Fli\u003E\u003Cli\u003EZondag 8 november 2026\u003C\u002Fli\u003E\u003Cli\u003EZondag 6 december 2026\u003C\u002Fli\u003E\u003Cli\u003EZondag 3 januari 2027\u003C\u002Fli\u003E\u003Cli\u003EZondag 14 februari 2027\u003C\u002Fli\u003E\u003Cli\u003EZondag 7 maart 2027\u003C\u002Fli\u003E\u003Cli\u003EZondag 4 april 2027\u003C\u002Fli\u003E\u003Cli\u003EDinsdag 27 april 2027 - Oranje Marathon\u003C\u002Fli\u003E\u003Cli\u003EZondag 2 mei 2027\u003C\u002Fli\u003E\u003Cli\u003EZondag 6 juni 2027 – Finale\u003C\u002Fli\u003E\u003C\u002Ful\u003E"}},{id:2038,url:"\u002Fnl\u002Fprogramma\u002Fyoga-concert-marije-horbach-annie-tangberg",title:"Yogaconcert",slug:"yoga-concert-marije-horbach-annie-tangberg",subTitle:"Marije Horbach & Annie Tangberg",oneLiner:a,intro:a,description:"\u003Cp\u003ETerwijl je gedurende drie tot vijf minuten in verstillende Yin-houdingen verblijft, vult de ruimte zich met de warme tonen van een piano, cello, harp of viool. De muziek fungeert niet alleen als achtergrond, maar als een&nbsp;begeleider&nbsp;die je helpt om dieper te ontspannen. Waar Yin Yoga zich richt op het stimuleren van het bindweefsel, zorgt de muziek voor een resonantie die de mentale ontspanning bevordert. Met je aandacht bij de mooie melodieën, word je minder snel afgeleid door je eigen gedachten. Het is een zintuigelijke ervaring waarbij beweging, ademhaling en geluid samenvloeien tot één harmonieus geheel. Of je nu een ervaren yogi bent of simpelweg op zoek bent naar een unieke manier om van muziek te genieten: dit concert is een cadeau aan jezelf.\u003C\u002Fp\u003E\u003Cp\u003ENeem je eigen matje en andere props mee, zoals kussens, een dekentje. De yogales wordt verzorgd door de ervaren yogadocente Marije Horbach en de professionele muzikanten zijn per keer verschillend. Je hoeft geen ervaring te hebben om mee te doen.\u003C\u002Fp\u003E\u003Cp\u003E\u003Cstrong\u003EOver Marije Horbach\u003C\u002Fstrong\u003E\u003Cbr\u003EMarije Horbach is een ervaren yogadocent uit ’s-Hertogenbosch die al meer dan tien jaar lesgeeft in zowel Den Bosch als Amsterdam. Met haar toegankelijke, rustige stijl begeleidt ze deelnemers naar ontspanning, lichaamsbewustzijn en verstilling - van beginners tot doorgewinterde yogi’s. Ze staat bekend om haar warme, persoonlijke aanpak en haar vermogen om yoga te verbinden met muziek en andere vormen van beweging, waardoor elke sessie voelt als een moment van aandacht en thuiskomen bij jezelf.\u003C\u002Fp\u003E\u003Cp\u003E\u003Cstrong\u003EBiografie Annie Tangberg\u003C\u002Fstrong\u003E\u003Cbr\u003ECello spelen, zingen, componeren - Annie Tångberg (Oslo, NO) is een muzikale omnivoor. Naast haar baan als celliste in het Metropole Orkest is ze te zien en horen in uiteenlopende projecten: van Elements of Freestyle (Ish! Dance Collective) of met een van haar vaste groepen West Side Trio, vocaal ensemble Vox Sturnus, Metropole Orkest Cellos en Martin Fondses Voice Orchestra. Tijdens deze yogalessen speelt ze meditatieve cellosolo’s.\u003C\u002Fp\u003E",startAt:O,endAt:ay,image1:{id:"330f2f98-656e-4c73-972d-6569a99ad219",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fyogaconcert-1920x1080.jpg?guid=330f2f98-656e-4c73-972d-6569a99ad219",credits:a,altText:a,alignment:y},image2:a,image3:a,image4:a,button:a,genres:[{id:s,name:aj}],attributes:[{id:o,name:E,type:{id:i,name:C},fields:{string:d}}],program:{id:843,startAt:O,endAt:ay,price:a,isCanceled:k,hasWaitingList:k,button:{text:"Uitverkocht",link:"https:\u002F\u002Ftix.theateraandeparade.nl\u002Fnl\u002Fbuyingflow\u002Ftickets\u002F57562\u002F"},location:{id:u,name:T},attributes:[],prices:[{id:14655,price:W,availability:b,saleStartAt:R,saleEndAt:O,type:{id:c,name:D},rank:{id:c,name:f}},{id:14656,price:W,availability:b,saleStartAt:e,saleEndAt:O,type:{id:o,name:F},rank:{id:c,name:f}},{id:14657,price:W,availability:b,saleStartAt:e,saleEndAt:O,type:{id:s,name:G},rank:{id:c,name:f}},{id:14658,price:W,availability:b,saleStartAt:e,saleEndAt:O,type:{id:t,name:H},rank:{id:c,name:f}},{id:14659,price:W,availability:b,saleStartAt:e,saleEndAt:O,type:{id:I,name:J},rank:{id:c,name:f}},{id:14660,price:W,availability:b,saleStartAt:e,saleEndAt:O,type:{id:r,name:K},rank:{id:c,name:f}},{id:14661,price:W,availability:b,saleStartAt:e,saleEndAt:O,type:{id:n,name:L},rank:{id:c,name:f}}],fields:{breakText:bv,extraInfo:d}},fields:{inleiding:"\u003Cp\u003EKom volledig tot rust tijdens het Yogaconcert, waarbij de verstilling van Yin Yoga versmelt met de klanken van live muziek.\u003C\u002Fp\u003E",showFoldoutsInHeader:g,title1:bw,text1:"\u003Cp\u003E\u003Ca href=\"http:\u002F\u002Fwww.annietangberg.nl\u002F\"\u003Ewww.annietangberg.nl\u003C\u002Fa\u003E\u003C\u002Fp\u003E",title2:ad,text2:aK,title3:d,text3:d}},{id:3495,url:"\u002Fnl\u002Fprogramma\u002Fdutch-classical-talent-elizabeth-goh",title:"Dutch Classical Talent: Elizabeth Goh",slug:"dutch-classical-talent-elizabeth-goh",subTitle:"The little blue notebook",oneLiner:a,intro:a,description:"\u003Cblockquote\u003E\u003Cp\u003E\u003Cstrong\u003EQuote jury:&nbsp;\u003C\u002Fstrong\u003E\u003Ci\u003EZelfverzekerd schakelt Elizabeth moeiteloos tussen de toy piano en de volwassen concertvleugel. Ze laat de toy piano klinken als een groot volwassen instrument en benadrukt de speelse jeugdigheid van de concertvleugel. Of andersom? In Elizabeths wondere pianoland staat alles op z’n kop.\u003C\u002Fi\u003E\u003C\u002Fp\u003E\u003C\u002Fblockquote\u003E\u003Cp\u003E\u003Cstrong\u003EProgramma:\u003C\u002Fstrong\u003E\u003Cbr\u003EMuziek van o.a. Escher, Gubaidulina, Crumb en nieuw werk van Mattias Spee &amp; Appolon Kalamenios\u003C\u002Fp\u003E\u003Cp\u003E\u003Cstrong\u003EOver Dutch Classical Talent&nbsp;\u003C\u002Fstrong\u003E\u003Cbr\u003EDutch Classical Talent (vroeger ‘het Vriendenkrans Concours’ en ‘Het Debuut’) is als talententraject een begrip in de Nederlandse klassieke muziekwereld. Onder de laureaten van Dutch Classical Talent bevinden zich tal van klinkende namen zoals Tania Kross, Lavinia Meijer, Nora Fischer, Van Baerle Trio en het Berlage Saxophone Quartet.&nbsp;\u003C\u002Fp\u003E\u003Cp\u003EVia audities kiest een vakjury vier toptalenten. Deze vier jonge musici ontwikkelen zich in een coachingsprogramma en gaan op tournee langs de veertien grootste concertzalen van Nederland om hun naam op de kaart te zetten. De concerten in Utrecht beginnen om 20:30 uur zonder pauze maar met een drankje en meet &amp; greet met deze jonge beloften na afloop. Hun programma’s zijn prikkelend, actueel, ontroerend en spectaculair.&nbsp;\u003C\u002Fp\u003E\u003Cp\u003EHet is een van de weinige zo niet het enige kamermuziekconcours in Nederland. De mogelijkheid die de finalisten krijgen om onder begeleiding een boeiend programma samen te stellen en het programma vervolgens veertien keer te mogen uitvoeren in de grote zalen in Nederland is uniek. Een prachtige manier om volop te experimenteren en zich in korte tijd op de kaart te zetten. De uitreiking van de DCT Award tijdens de feestelijke finale rondt het project van 18 maanden op een passende manier af.\u003C\u002Fp\u003E",startAt:bx,endAt:ay,image1:{id:"b0e0747e-9284-4144-a292-aaac1b74f9b0",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fdct-elisabeth-goh-w2-klassiek-1920-x-1080.jpg?guid=b0e0747e-9284-4144-a292-aaac1b74f9b0",credits:"Merlijn Doomernik",altText:"Pianiste leunend op piano met grafische achtergrond",alignment:y},image2:a,image3:a,image4:a,button:a,genres:[{id:r,name:_}],attributes:[{id:s,name:aO,type:{id:i,name:C},fields:{string:d}}],program:{id:1124,startAt:bx,endAt:ay,price:17.5,isCanceled:k,hasWaitingList:k,button:{text:"Bestel via Willem Twee",link:"https:\u002F\u002Fwillem-twee.stager.co\u002Fshop\u002Fdefault\u002Fevents\u002F111605769?utm_campaign=261011-Dutch+Classical+Talent%3a+Elizabeth+Goh-111605769&utm_medium=eventpublicity&utm_source=Website"},location:{id:ag,name:aP},attributes:[],prices:[],fields:{breakText:d,extraInfo:d}},fields:{inleiding:"\u003Cp\u003EElizabeth Goh maakte indruk op de jury van Dutch Classical Talent met haar onconventionele pianorecital. De van oorsprong Singaporese pianist combineert muziek, verhalen en een bewegingskunstenaar in een recital dat uitnodigt tot nadenken over de rol van verbeelding in een onrustige wereld. Let daarbij vooral op de vrolijke rol van de speelgoedpiano en de nieuwe composities van Mattias Spee en Appollon Kalamenios.\u003C\u002Fp\u003E",showFoldoutsInHeader:g,title1:d,text1:d,title2:d,text2:d,title3:d,text3:d}},{id:5326,url:"\u002Fnl\u002Fprogramma\u002Flieve-hemel",title:"Lieve Hemel",slug:"lieve-hemel",subTitle:"Joris Linssen",oneLiner:a,intro:a,description:"\u003Cp\u003EIn \u003Ci\u003ELieve Hemel\u003C\u002Fi\u003E duikt presentator en zanger Joris Linssen in het eeuwenoude Bijbelverhaal van Ruth op zoek naar inspiratie voor het leven nu. Een ontroerende en eigentijdse zoektocht in een wereld die razendsnel verandert en waar mensen elkaar soms uit het oog verliezen.\u003C\u002Fp\u003E\u003Cp\u003EDe directe aanleiding voor de theatershow ontstond toen Linssen toevallig binnenstapte bij het Kerkasiel in Kampen, waar de familie Babayants al maandenlang bescherming vindt in een kerk. De veerkracht van de familie en de betrokkenheid van de vrijwilligers raken Joris diep. Hun ervaringen echoën de kern van het verhaal van Ruth: loslaten, moed vinden en hoop zoeken én de vraag wie er welkom is. Uit die ontmoeting ontstond de centrale vraag die door de hele voorstelling heen klinkt: Is er nog plek onder de hemel voor iedereen?\u003C\u002Fp\u003E\u003Cp\u003ESamen met muzikanten Myrthe van de Weetering (zang, viool en contrabas) en Vera Marijt (piano, toetsen en zang) brengt Joris een voorstelling vol kwetsbare verhalen en herkenbare muziek, verweven met persoonlijke reflecties.\u003C\u002Fp\u003E\u003Cp\u003E\u003Ci\u003ELieve Hemel\u003C\u002Fi\u003E is een ontroerende voorstelling over angst en overgave, over verliezen en opnieuw beginnen. Een voorstelling die uitnodigt om stil te staan bij wat ons verbindt en bij de kleine wonderen die kunnen ontstaan wanneer we ons hart openhouden.\u003C\u002Fp\u003E\u003Cp\u003E\u003Ci\u003ELieve Hemel\u003C\u002Fi\u003E is een productie van Nachtzon Media in samenwerking met de Protestantse Kerk.\u003C\u002Fp\u003E\u003Cp\u003E&nbsp;\u003C\u002Fp\u003E",startAt:by,endAt:bz,image1:{id:"22efedbd-d8a4-4543-86d0-b64a4c193de2",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Flieve-hemel-1920x1080.jpg?guid=22efedbd-d8a4-4543-86d0-b64a4c193de2",credits:a,altText:a,alignment:y},image2:a,image3:a,image4:a,button:a,genres:[{id:o,name:aQ}],attributes:[{id:c,name:aq,type:{id:c,name:aa},fields:{string:ab}}],program:{id:1706,startAt:by,endAt:bz,price:40.1,isCanceled:k,hasWaitingList:k,button:{text:P,link:"https:\u002F\u002Fshop.podiumtickets.nl\u002Fevent\u002Flieve-hemel-den-bosch-g8bvls"},location:{id:u,name:T},attributes:[],prices:[],fields:{breakText:"Geen pauze, drankje niet inbegrepen",extraInfo:bA}},fields:{inleiding:"\u003Cp\u003ENa het succes van \u003Ci\u003EIn Gods naam\u003C\u002Fi\u003E met Bas Ragas komt Nachtzon Media in samenwerking met de Protestantse Kerk in Nederland met een nieuwe muzikale voorstelling.\u003C\u002Fp\u003E",showFoldoutsInHeader:g,title1:d,text1:d,title2:ad,text2:"\u003Cp\u003EKaarten en meer info: \u003Ca href=\"https:\u002F\u002Fwww.theaterlievehemel.nl\"\u003Ewww.theaterlievehemel.nl\u003C\u002Fa\u003E\u003C\u002Fp\u003E",title3:d,text3:d}},{id:3960,url:"\u002Fnl\u002Fprogramma\u002Fspitters-emma-van-het-verzet",title:"Spitters, Emma van het Verzet",slug:"spitters-emma-van-het-verzet",subTitle:" ",oneLiner:a,intro:a,description:"\u003Cp\u003EVanuit het perspectief van Emma, een jonge vrouw op de vlucht, ontvouwt zich een verhaal over verborgen helden, verraad, en de zoektocht naar gerechtigheid. In een decor van oorlog en wantrouwen graaft zij — samen met haar man Karel — naar de waarheid achter verdwenen levens en gestolen bezittingen.\u003C\u002Fp\u003E\u003Cp\u003EWat begint als een vlucht, groeit uit tot een strijd voor erkenning en herinnering.\u003C\u002Fp\u003E\u003Cp\u003EMet livemuziek, jonge en professionele spelers, en een poëtische vertelstijl brengt Spitters een pijnlijk actuele ode aan mensen die bleven zoeken, ook toen de wereld zweeg.\u003C\u002Fp\u003E",startAt:aR,endAt:bB,image1:{id:"88d542a1-9070-4686-b7e3-6c46d3be2a03",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Femma-van-het-verzet-1920x1080.jpg?guid=88d542a1-9070-4686-b7e3-6c46d3be2a03",credits:a,altText:a,alignment:y},image2:a,image3:a,image4:a,button:a,genres:[{id:n,name:az}],attributes:[{id:c,name:aq,type:{id:c,name:aa},fields:{string:ab}},{id:o,name:E,type:{id:i,name:C},fields:{string:d}}],program:{id:1227,startAt:aR,endAt:bB,price:a,isCanceled:k,hasWaitingList:k,button:{text:P,link:"https:\u002F\u002Ftix.theateraandeparade.nl\u002Fnl\u002Fbuyingflow\u002Ftickets\u002F59943\u002F"},location:{id:u,name:T},attributes:[],prices:[{id:16354,price:40.45,availability:271,saleStartAt:"2026-06-05T13:00:00",saleEndAt:aR,type:{id:c,name:D},rank:{id:c,name:f}}],fields:{breakText:bq,extraInfo:bA}},fields:{inleiding:"\u003Cp\u003ESpitters is een aangrijpend muziektheaterstuk over moed, verlies en morele keuzes tijdens de Tweede Wereldoorlog.\u003C\u002Fp\u003E",showFoldoutsInHeader:g,title1:d,text1:d,title2:d,text2:d,title3:d,text3:d}},{id:5231,url:"\u002Fnl\u002Fprogramma\u002Ftheaterlab-nu-het-nog-rustig-is",title:"Theaterlab: Nu is het nog rustig (8-12 jaar)",slug:"theaterlab-nu-het-nog-rustig-is",subTitle:"Alleen voor kinderen. Ouders zijn deze keer even vrij.",oneLiner:a,intro:a,description:"\u003Cp\u003ETheaterlab is een speciale theaterclub voor kinderen van 6 tot 12 jaar. Samen met maximaal 14 andere kinderen beleef je een bijzondere avond in het theater, helemaal zonder je ouders.\u003Cbr\u003E\u003Cbr\u003EEen uur voor de voorstelling word je ontvangen door theaterdocent&nbsp;\u003Cstrong\u003ERonia Hitipeuw\u003C\u002Fstrong\u003E. Samen gaan jullie aan de slag met een speelse theaterworkshop. Je ontdekt alvast de thema’s, personages en verhalen uit de voorstelling&nbsp;\u003Ca href=\"https:\u002F\u002Fwww.theateraandeparade.nl\u002Fnl\u002Fprogramma\u002Fartemis-het-paleis-hzt-nu-het-nog-rustig-is-8\"\u003E\u003Ci\u003ENu is het nog rustig (8+)\u003C\u002Fi\u003E\u003C\u002Fa\u003E van&nbsp;\u003Cstrong\u003ETheater Artemis\u003C\u002Fstrong\u003E, \u003Cstrong\u003Ehetpaleis \u003C\u002Fstrong\u003Een&nbsp;\u003Cstrong\u003EHet Zuidelijk Toneel\u003C\u002Fstrong\u003E en maakt kennis met de wereld die je daarna op het podium gaat zien.\u003Cbr\u003E\u003Cbr\u003EVervolgens gaan jullie samen de voorstelling bekijken. Na afloop is het tijd om na te praten. Onder het genot van een glaasje ranja delen jullie wat je leuk, grappig, spannend of misschien wel een beetje gek vond.\u003C\u002Fp\u003E",startAt:aS,endAt:bC,image1:{id:"cbdb9fe7-145c-42f8-ac8f-70e601f9da29",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fcampagnebeeld-theaterlab.jpg?guid=cbdb9fe7-145c-42f8-ac8f-70e601f9da29",credits:a,altText:a,alignment:y},image2:a,image3:a,image4:a,button:{text:P,link:d},genres:[{id:aA,name:aB},{id:s,name:aj}],attributes:[{id:o,name:E,type:{id:i,name:C},fields:{string:d}}],program:{id:1655,startAt:aS,endAt:bC,price:x,isCanceled:k,hasWaitingList:k,button:{text:P,link:"https:\u002F\u002Ftix.theateraandeparade.nl\u002Fnl\u002Fbuyingflow\u002Ftickets\u002F60781\u002F"},location:{id:aT,name:aU},attributes:[{id:u,name:bD,type:{id:c,name:aa},fields:{}}],prices:[{id:16767,price:x,availability:w,saleStartAt:"2026-09-03T10:00:00",saleEndAt:aS,type:{id:aV,name:"Theaterlab"},rank:{id:c,name:f}}],fields:{breakText:"Geen pauze, drankje inbegrepen",extraInfo:d}},fields:{inleiding:"\u003Cp\u003EEen theateravond helemaal voor jou! Tijdens Theaterlab ontdek je samen met andere kinderen de wereld achter de voorstelling, doe je een speelse theaterworkshop en beleef je daarna de voorstelling. En je ouders? Die zijn deze keer even vrij.&nbsp;\u003C\u002Fp\u003E",showFoldoutsInHeader:g,title1:"Andere Theaterlab-edities",text1:"\u003Cul\u003E\u003Cli\u003E\u003Ca href=\"https:\u002F\u002Fwww.theateraandeparade.nl\u002Fnl\u002Fprogramma\u002Ftheaterlab-juf-braaksel\"\u003Eza 24 okt 2026: Theaterlab: Juf Braaksel de Musical ( 6-12 jaar)\u003C\u002Fa\u003E&nbsp;\u003C\u002Fli\u003E\u003Cli\u003E\u003Ca href=\"https:\u002F\u002Fwww.theateraandeparade.nl\u002Fnl\u002Fprogramma\u002Ftheaterlab-alle-kinderen-stinken\"\u003Ezo 1 nov 2026: Theaterlab: Alle kinderen stinken (6-12 jaar)\u003C\u002Fa\u003E\u003C\u002Fli\u003E\u003Cli\u003E\u003Ca href=\"https:\u002F\u002Fwww.theateraandeparade.nl\u002Fnl\u002Fprogramma\u002Ftheaterlab-efteling-verteltbaron-1898\"\u003Ezo 13 dec 2026: Theaterlab: Efteling vertelt…Baron 1898 (6-12 jaar)\u003C\u002Fa\u003E\u003C\u002Fli\u003E\u003Cli\u003E\u003Ca href=\"https:\u002F\u002Fwww.theateraandeparade.nl\u002Fnl\u002Fprogramma\u002Ftheaterlab-en-nou-gaan-we-even-helemaal-uit-onze-plaat\"\u003Ezo 3 jan 2027: EN NOU GAAN WE EVEN HELEMAAL UIT ONZE PLAAT (6-12 jaar)\u003C\u002Fa\u003E\u003C\u002Fli\u003E\u003C\u002Ful\u003E",title2:d,text2:d,title3:d,text3:d}},{id:1878,url:"\u002Fnl\u002Fprogramma\u002Fartemis-het-paleis-hzt-nu-het-nog-rustig-is-8",title:"Nu is het nog rustig (8+)",slug:"artemis-het-paleis-hzt-nu-het-nog-rustig-is-8",subTitle:"Theater Artemis | hetpaleis | Het Zuidelijk Toneel",oneLiner:a,intro:a,description:"\u003Cp\u003EEr wordt geflirt, gekibbeld, gelachen en gehuild. In dit op hol geslagen drama wisselen hoge pieken en diepe dalen elkaar in een duizelingwekkend tempo af. Alles in een koortsachtige poging om een onuitwisbare indruk achter te laten.\u003C\u002Fp\u003E\u003Cp\u003EEn dat terwijl ergens in een uithoek van ons blikveld iets anders lijkt te bewegen. Het gaat tergend traag, maar er is onmiskenbaar iets aan het gebeuren. Maar daar hebben deze 18-plussers geen tijd voor. Ze moeten door! De volgende bijzaak schreeuwt alweer om hun aandacht.&nbsp;\u003C\u002Fp\u003E\u003Cp\u003EKan iemand hen misschien helpen? Behoudt iemand hier wel het overzicht? Zijn er misschien kinderen in de zaal?&nbsp;\u003C\u002Fp\u003E\u003Cp\u003ENa het succes van&nbsp;\u003Ci\u003EHet eind van het begin van het einde&nbsp;\u003C\u002Fi\u003E(2020),&nbsp;\u003Ci\u003EEen leuk avondje uit\u003C\u002Fi\u003E (2022) en&nbsp;\u003Ci\u003EDe\u003C\u002Fi\u003E (2024) bundelen Theater Artemis, hetpaleis en Het Zuidelijk Toneel met&nbsp;\u003Ci\u003ENu is het nog rustig&nbsp;\u003C\u002Fi\u003Evoor een vierde keer de krachten. Regisseur en artistiek leider van Theater Artemis ontving in september 2026 de Regieprijs van het Nederlands Theater festival.\u003C\u002Fp\u003E",startAt:j,endAt:bE,image1:{id:"1a6a281d-147b-4e96-bdba-1ff749e26d70",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002
