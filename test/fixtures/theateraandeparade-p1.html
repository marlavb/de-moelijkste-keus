ordt begeleid door het gerenommeerde Nederlandse symfonieorkest Philzuid, onder leiding van Grammy Award-winnende dirigent Karen Kamensek.\u003C\u002Fp\u003E\u003Cp\u003EDit jaar krijgen opera en oratorium evenveel nadruk. Elke zanger treedt daarom tweemaal op tijdens de Main Rounds. Dit biedt u de bijzondere kans om uw favoriete zanger meer dan eens te horen.\u003C\u002Fp\u003E\u003Cp\u003EWinnaars van het IVC-concours bereiken de grootste operapodia ter wereld. Naast een totaal prijzengeld van meer dan €50.000, ontvangen deelnemers persoonlijke feedback van een internationale jury van toonaangevende professionals, onder de bezielende leiding van opera- regisseur Sir David Pountney.\u003C\u002Fp\u003E\u003Cp\u003EOok nemen zij deel aan inspirerende masterclasses en workshops en bouwen zij duurzame artistieke relaties op. Dankzij intensieve begeleiding, mentorschap en gerichte loopbaanondersteuning vormt de IVC voor iedere deelnemer een waardevolle en inspirerende ervaring.\u003C\u002Fp\u003E\u003Cp\u003EAndrew Watts, algemeen en artistiek directeur van IVC en countertenor, werkt met lokale (amateur) zangers: een bijzondere kans voor liefhebbers van zang en u kunt kennismaken met een breed scala aan talent uit ’s-Hertogenbosch en Brabant.\u003C\u002Fp\u003E\u003Cp\u003E\u003Cstrong\u003EPassepartout\u003C\u002Fstrong\u003E\u003Cbr\u003EWilt u niets missen? Met de IVC Passepartout 2026 volgt u alle deelnemers op de voet en heeft u toegang tot alle activiteiten van vrijdag 2 tot en met zaterdag 10 oktober.\u003C\u002Fp\u003E",startAt:K,endAt:ci,image1:{id:"bc368cdf-1191-4272-bd39-1f82c4797e3f",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fandrew-watts-1920x1080.png?guid=bc368cdf-1191-4272-bd39-1f82c4797e3f",credits:a,altText:a,alignment:x},image2:a,image3:a,image4:a,button:a,genres:[{id:r,name:Q},{id:B,name:T}],attributes:[{id:b,name:aa,type:{id:b,name:R},fields:{string:S}},{id:o,name:P,type:{id:i,name:C},fields:{string:e}}],program:{id:1143,start u003Cstrong\u003EOver René\u003C\u002Fstrong\u003E\u003Cbr\u003ERené won met \u003Ci\u003E2636\u003C\u002Fi\u003E, zijn vorige voorstelling, de Poelifinario, de prijs voor het beste cabaretprogramma. Deze opvolger \u003Ci\u003ENoodzakelijk kwaad\u003C\u002Fi\u003E werd direct daarna ook genomineerd voor die prijs. Van Meurs is al jaren vaste waarde van comedycollectief Comedytrain. Hij won de jury- en publieksprijs van Cameretten, toerde met vijf avondvullende programma’s langs uitverkochte zalen en werd in 2018 genomineerd voor de Neerlands Hoop.\u003C\u002Fp\u003E",startAt:m,endAt:cj,image1:{id:"ba9d834b-189b-442f-ac4a-7f10b82d55c2",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Frene-van-meurs-noodzakelijk-kwaad-c-kevin-orduna-scala-photography-1920x1080.jpg?guid=ba9d834b-189b-442f-ac4a-7f10b82d55c2",credits:a,altText:a,alignment:x},image2:a,image3:a,image4:a,button:a,genres:[{id:s,name:aN}],attributes:[{id:aV,name:aF,type:{id:b,name:R},fields:{string:e}},{id:B,name:aF,type:{id:aE,name:aB},fields:{string:e}},{id:aD,name:"Reprise",type:{id:b,name:R},fields:{string:e}},{id:o,name:P,type:{id:i,name:C},fields:{string:e}}],program:{id:789,startAt:m,endAt:cj,price:a,isCanceled:l,hasWaitingList:l,button:{text:"Laatste kaarten",link:"https:\u002F\u002Ftix.theateraandeparade.nl\u002Fnl\u002Fbuyingflow\u002Ftickets\u002F57034\u002F"},location:{id:Z,name:aJ},attributes:[],prices:[{id:15731,price:c,availability:c,saleStartAt:a,saleEndAt:m,type:{id:s,name:ah},rank:{id:b,name:f}},{id:15732,price:c,availability:c,saleStartAt:a,saleEndAt:m,type:{id:s,name:ah},rank:{id:n,name:p}},{id:15733,price:c,availability:c,saleStartAt:a,saleEndAt:m,type:{id:s,name:ah},rank:{id:k,name:q}},{id:13616,price:ai,availability:b,saleStartAt:y,saleEndAt:m,type:{id:k,name:ak},rank:{id:b,name:f}},{id:13617,price:ai,availability:b,saleStartAt:y,saleEndAt:m,type:{id:k,name:ak},rank:{id:n,name:p}},{id:13618,price:ai,availability:b,saleStartAt:y,saleEndAt:m,type:{id:k,name:ak},rank:{id: e symfonieorkest Philzuid, onder leiding van Grammy Award-winnende dirigent Karen Kamensek.\u003C\u002Fp\u003E\u003Cp\u003EDit jaar krijgen opera en oratorium evenveel nadruk. Elke zanger treedt daarom tweemaal op tijdens de Main Rounds. Dit biedt u de bijzondere kans om uw favoriete zanger meer dan eens te horen.\u003C\u002Fp\u003E\u003Cp\u003EWinnaars van het IVC-concours bereiken de grootste operapodia ter wereld. Naast een totaal prijzengeld van meer dan €50.000, ontvangen deelnemers persoonlijke feedback van een internationale jury van toonaangevende professionals, onder de bezielende leiding van opera- regisseur Sir David Pountney.\u003C\u002Fp\u003E\u003Cp\u003EOok nemen zij deel aan inspirerende masterclasses en workshops en bouwen zij duurzame artistieke relaties op. Dankzij intensieve begeleiding, mentorschap en gerichte loopbaanondersteuning vormt de IVC voor iedere deelnemer een waardevolle en inspirerende ervaring.\u003C\u002Fp\u003E\u003Cp\u003EOperaregisseur, schrijver en veelgeprezen artistiek leider Sir David Pountney staat internationaal bekend om zijn ensceneringen van zelden opgevoerde opera’s en nieuwe producties van klassieke werken.\u003C\u002Fp\u003E\u003Cp\u003E\u003Cstrong\u003EPassepartout\u003C\u002Fstrong\u003E\u003Cbr\u003EWilt u niets missen? Met de IVC Passepartout 2026 volgt u alle deelnemers op de voet en heeft u toegang tot alle activiteiten van vrijdag 2 tot en met zaterdag 10 oktober.\u003C\u002Fp\u003E",startAt:L,endAt:cm,image1:{id:"d2d81042-c700-4164-afb8-bf210f5ca99d",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fsir-david-pountney-1920x1080.png?guid=d2d81042-c700-4164-afb8-bf210f5ca99d",credits:a,altText:a,alignment:x},image2:a,image3:a,image4:a,button:a,genres:[{id:r,name:Q},{id:B,name:T}],attributes:[{id:b,name:aa,type:{id:b,name:R},fields:{string:S}},{id:o,name:P,type:{id:i,name:C},fields:{string:e}}],program:{id:1144,startAt:L,endAt:cm,price:a,isCanceled:l,hasWaitingList:l,button:{text:ag,link:"https ere kans om uw favoriete zanger meer dan eens te horen.\u003C\u002Fp\u003E\u003Cp\u003EWinnaars van het IVC-concours bereiken de grootste operapodia ter wereld. Naast een totaal prijzengeld van meer dan €50.000, ontvangen deelnemers persoonlijke feedback van een internationale jury van toonaangevende professionals, onder de bezielende leiding van opera- regisseur Sir David Pountney.\u003C\u002Fp\u003E\u003Cp\u003EOok nemen zij deel aan inspirerende masterclasses en workshops en bouwen zij duurzame artistieke relaties op. Dankzij intensieve begeleiding, mentorschap en gerichte loopbaanondersteuning vormt de IVC voor iedere deelnemer een waardevolle en inspirerende ervaring.\u003C\u002Fp\u003E\u003Cp\u003ESusan Bullock is een van ’s werelds meest gevraagde dramatische sopranen aan prestigieuze podia als Covent Garden, de Weense Staatsopera, de Deutsche Oper Berlin, Opera Australia. Ze is bij jonge zangers zeer geliefd als docent.\u003C\u002Fp\u003E\u003Cp\u003E\u003Cstrong\u003EPassepartout\u003C\u002Fstrong\u003E\u003Cbr\u003EWilt u niets missen? Met de IVC Passepartout 2026 volgt u alle deelnemers op de voet en heeft u toegang tot alle activiteiten van vrijdag 2 tot en met zaterdag 10 oktober.\u003C\u002Fp\u003E",startAt:M,endAt:co,image1:{id:"5359c400-6c8c-4c99-8e5e-c339cddd9fec",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fsusan-bullock-1920x1080.png?guid=5359c400-6c8c-4c99-8e5e-c339cddd9fec",credits:a,altText:a,alignment:x},image2:a,image3:a,image4:a,button:a,genres:[{id:r,name:Q},{id:B,name:T}],attributes:[{id:b,name:aa,type:{id:b,name:R},fields:{string:S}},{id:o,name:P,type:{id:i,name:C},fields:{string:e}}],program:{id:1145,startAt:M,endAt:co,price:a,isCanceled:l,hasWaitingList:l,button:{text:ag,link:"https:\u002F\u002Ftix.theateraandeparade.nl\u002Fnl\u002Fbuyingflow\u002Ftickets\u002F59637\u002F"},location:{id:u,name:V},attributes:[],prices:[{id:16231,price:i,availability:bd,saleStartAt:d,saleEndAt:M,type:{id:ab,name:ax},rank:{id:b,name: s\u002FArnie Zane Dance Company, BBC Orchestra, LA Philharmonic en International Contemporary Ensemble. Chow bracht meer dan 25 solo- en kamermuziekalbums uit op labels als Nonesuch Records, Cantaloupe, New Amsterdam Records, Tzadik en Innova Recordings. In oktober 2022 verscheen haar opname \u003Ci\u003EPhilip Glass: Piano Etudes Book 1\u003C\u002Fi\u003E, waarover Glass opmerkte dat het “een zeer dynamische en expressieve uitvoering” is, met een energie die uniek van haar is.\u003C\u002Fp\u003E",startAt:cp,endAt:cq,image1:{id:"96419eae-ff12-47f3-bc82-4769311f9c4c",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fvicky-chow-mivos-quartet-w2-klassiek-1920-x-1080.jpg?guid=96419eae-ff12-47f3-bc82-4769311f9c4c",credits:a,altText:"Strijkerskwartet",alignment:x},image2:a,image3:a,image4:a,button:a,genres:[{id:r,name:Q}],attributes:[{id:t,name:aT,type:{id:i,name:C},fields:{string:e}}],program:{id:1123,startAt:cp,endAt:cq,price:29.5,isCanceled:l,hasWaitingList:l,button:{text:"Bestel via Willem Twee",link:"https:\u002F\u002Fwillem-twee.stager.co\u002Fshop\u002Fdefault\u002Fevents\u002F111602937?utm_campaign=261008-Vicky+Chow+%26+Mivos+Quartet-111602937&utm_medium=eventpublicity&utm_source=Website"},location:{id:U,name:aX},attributes:[],prices:[],fields:{breakText:e,extraInfo:e}},fields:{inleiding:"\u003Cp\u003EVicky Chow en Mivos Quartet bundelen hun krachten voor de uitvoering van Morton Feldmans&nbsp;\u003Ci\u003EPiano and String Quartet\u003C\u002Fi\u003Eop 8 april 2026, ter ere van de 100ste geboortedag van de componist.Met een duur van ongeveer 90 minuten is dit monumentale werk een van Feldmans meest iconische late composities. Het ontvouwt zich in een uitgestrekte, verstilde klankwereld die uitnodigt tot diep en geconcentreerd luisteren. Vicky Chow en Mivos Quartet brengen Morton Feldmans&nbsp;\u003Ci\u003EPiano and String Quartet\u003C\u002Fi\u003E ter ere van de 100ste geboortedag van de componist.\u003C\u002Fp\u003E",showFoldoutsInHeader:h,title1 "een-bossche-avond-om-te-zoenen",subTitle:"Stichting Iedereen Mag Zoenen",oneLiner:a,intro:a,description:"\u003Cp\u003E\u003Cstrong\u003EEen avond om te voelen, vieren en verbinden\u003C\u002Fstrong\u003E\u003Cbr\u003ENa de eerste succesvolle editie van het Iedereen Mag Zoenen Festival in 2025 keert de stichting terug naar Theater aan de Parade. Niet met een volledig festival, maar met een bijzondere avond waarop verhalen, muziek en ontmoeting centraal staan.\u003C\u002Fp\u003E\u003Cp\u003EIedereen Mag Zoenen staat voor een samenleving waarin iedereen de vrijheid heeft om zichzelf te zijn en lief te hebben wie die wil. Een boodschap die niet alleen tijdens een festival gehoord mag worden. Juist ook in de periode tussen de festivals blijft het belangrijk om elkaar te ontmoeten, verhalen te delen en ruimte te maken voor verschillende ervaringen en perspectieven.\u003C\u002Fp\u003E\u003Cp\u003ETijdens deze speciale avond komt een grote diversiteit aan verhalen en muziek samen. Verwacht een programma dat raakt, inspireert en soms uitdaagt. Er is ruimte voor persoonlijke en kwetsbare verhalen, maar minstens zoveel voor plezier, muziek en het vieren van wie je bent.\u003Cbr\u003E\u003Cbr\u003EKom luisteren, kijken, ontmoeten en vieren. Want iedereen mag zoenen!\u003Cbr\u003E\u003Cbr\u003E\u003Cstrong\u003EProgramma '26:\u003C\u002Fstrong\u003E\u003Cbr\u003E19:30 uur: Inloop\u003Cbr\u003E20:00 uur: Opening\u003Cbr\u003E20:10 uur: Coming-out gesprekken\u003Cbr\u003E20:30 uur: Jubileum van de Brabantse Potcast\u003Cbr\u003E20:50 uur: Live Optreden Jip Hover\u003Cbr\u003E21:20 uur: Interviews over inclusiviteit, diversiteit &amp; identiteit&nbsp;\u003Cbr\u003E21:50 uur: Live Optreden Babs op de Beat &amp; Huisband TadP&nbsp;\u003C\u002Fp\u003E",startAt:cs,endAt:ct,image1:{id:"7fd45bbe-078e-464a-a055-53dcc77e1666",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fimz_avond-om-te-zoenen_banner_website_2026.png?guid=7fd45bbe-078e-464a-a055-53dcc77e1666",credits:a,altText:a,alignment:"focus-23%-78%"},image2:a,image3:a,image4:a,button:{text:cu,link:e},genres:[{id:t,name:aO}],attributes:[{id:b,name:aa,type:{id:b,name:R},fields:{string:S}}],program:{id:1767,startAt:cs,endAt:ct,price:c,isCanceled:l,hasWaitingList:l,button:{text:cu,link:e},location:{id:k,name:aW},attributes:[],prices:[],fields:{breakText:"Pauze, geen drankje inbegrepen",extraInfo:"De toegang voor deze gastproductie is gratis."}},fields:{inleiding:"\u003Cp\u003EIedereen mag zichzelf zijn. Iedereen mag liefhebben wie die wil. Op vrijdag 9 oktober komt Iedereen Mag Zoenen naar Theater aan de Parade voor een bijzondere avond vol verhalen, muziek en ontmoeting. Een avond die raakt, inspireert én ruimte geeft om samen te vieren wie we zijn.\u003C\u002Fp\u003E",showFoldoutsInHeader:h,title1:e,text1:e,title2:e,text2:e,title3:e,text3:e}},{id:3777,url:"\u002Fnl\u002Fprogramma\u002F59th-ivc-opera-oratorium-masterclass-sir-john",title:al,slug:"59th-ivc-opera-oratorium-masterclass-sir-john",subTitle:"Masterclass Peter Rose",oneLiner:a,intro:a,description:"\u003Cp\u003EMeer dan een week lang verandert de IVC Den Bosch weer in een bruisende ontmoetingsplek voor de meest veelbelovende stemmen ter wereld. Na audities in heel Europa, Azië en de Verenigde Staten nemen veertig uitmuntende jonge zangers deel aan de live rondes. De finale in Theater aan de Parade wordt begeleid door het gerenommeerde Nederlandse symfonieorkest Philzuid, onder leiding van Grammy Award-winnende dirigent Karen Kamensek.\u003C\u002Fp\u003E\u003Cp\u003EDit jaar krijgen opera en oratorium evenveel nadruk. Elke zanger treedt daarom tweemaal op tijdens de Main Rounds. Dit biedt u de bijzondere kans om uw favoriete zanger meer dan eens te horen.\u003C\u002Fp\u003E\u003Cp\u003EWinnaars van het IVC-concours bereiken de grootste operapodia ter wereld. Naast een totaal prijzengeld van meer dan €50.000, ontvangen deelnemers persoonlijke feedback van een internationale jury van toonaangevende professionals, onder d e relaties op. Dankzij intensieve begeleiding, mentorschap en gerichte loopbaanondersteuning vormt de IVC voor iedere deelnemer een waardevolle en inspirerende ervaring.\u003C\u002Fp\u003E\u003Cp\u003EDe International Vocal Competition organiseert in samenwerking met het Prinses Christina Concours en de Margreet Honig Stichting een netwerkdag en rondetafelgesprekken. Zangers en zangdocenten kunnen netwerken opbouwen, ideeën uitwisselen en manieren ontwikkelen voor het beste zangonderwijs in Nederland.\u003C\u002Fp\u003E\u003Cp\u003EMet Andrew Watts (IVC), Maurits Musch (PCC), Margreet Honig (MHF), Paul McNamara (DNOA – CvA), Marjolein Niels (Hoofd Zang - Den Haag) en Manuela Ochakovski (Zangpedagoog) e.a.\u003C\u002Fp\u003E\u003Cul\u003E\u003Cli\u003E10:30 uur: Registratie\u003C\u002Fli\u003E\u003Cli\u003E11:00 uur: Rondetafelgesprek en netwerksessie ‘From Cradle to Competition and Beyond’\u003C\u002Fli\u003E\u003Cli\u003E13:30 uur: Lunch\u003C\u002Fli\u003E\u003C\u002Ful\u003E\u003Cp\u003E\u003Cstrong\u003EPassepartout\u003C\u002Fstrong\u003E\u003Cbr\u003EWilt u niets missen? Met de IVC Passepartout 2026 volgt u alle deelnemers op de voet en heeft u toegang tot alle activiteiten van vrijdag 2 tot en met zaterdag 10 oktober.\u003C\u002Fp\u003E",startAt:be,endAt:cw,image1:{id:"90073d8a-d50c-423f-84c4-8ce3b27f2843",url:"https:\u002F\u002Fmedia.theateraandeparade.nl\u002Fmedia\u002Fwebsite-header-1920x1080-2.jpg?guid=90073d8a-d50c-423f-84c4-8ce3b27f2843",credits:a,altText:a,alignment:x},image2:a,image3:a,image4:a,button:a,genres:[{id:r,name:Q},{id:B,name:T}],attributes:[{id:b,name:aa,type:{id:b,name:R},fields:{string:S}},{id:o,name:P,type:{id:i,name:C},fields:{string:e}}],program:{id:1212,startAt:be,endAt:cw,price:a,isCanceled:l,hasWaitingList:l,button:{text:"Meld je gratis aan",link:"https:\u002F\u002Ftix.theateraandeparade.nl\u002Fnl\u002Fbuyingflow\u002Ftickets\u002F59834\u002F"},location:{id:u,name:V},attributes:[],prices:[{id:16347,price:c,availability:374,saleSta
