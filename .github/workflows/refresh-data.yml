name: Refresh data

on:
  schedule:
    # 03:17 UTC = 04:17 (winter) / 05:17 (zomer) tijd in Amsterdam.
    # Bewust een scheve minuut: GitHub stelt geplande runs op het hele uur
    # vaak uren uit (de run van 04:00 begon op 29 sep 2026 pas om 10:33),
    # omdat daar de meeste workflows tegelijk starten. Niets in deze of de
    # deploy-workflow rekent op dit tijdstip.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

# Nooit twee refreshes tegelijk (bv. een handmatige run terwijl de geplande
# nog loopt): de tweede zou anders bij de push falen op een verouderde
# checkout. Een lopende run wordt niet afgebroken; de nieuwe wacht.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write
  # Nodig om aan het eind de deploy-workflow te triggeren (zie onderaan).
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ref: main in plaats van de commit waarop de run getriggerd werd: een
      # run die in de concurrency-wachtrij stond, moet de nieuwste main
      # uitchecken (inclusief de data van de run vóór hem), niet de SHA van
      # het moment dat hij werd aangemaakt.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Playwright's Chromium installeren
        run: npx playwright install --with-deps chromium

      # Faalt één theater (exception, timeout, of onverwacht 0 resultaten),
      # dan valt src/index.js terug op de vorige data van dat theater en
      # schrijft het de uitkomst per theater naar public/data/scrape-status.json.
      # Deze stap zelf slaagt dan gewoon, zodat de data altijd wordt bijgewerkt.
      - name: Agenda's scrapen
        run: node src/index.js
        env:
          # Contact-URL in de user-agent (publiek, dus een variabele, geen secret).
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}

      # src/index.js ontdubbelt al vóór het wegschrijven (src/lib/dedupe.js);
      # deze test bewaakt dat vangnet. Faalt hij, dan wordt er niets gecommit.
      - name: Controle op dubbele voorstellingen
        run: node --test test/dedupe.test.js

      - name: public/data (shows, scrape-status, theaters) committen en pushen
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Is main tijdens het scrapen verder gegaan (code-push, of data van
          # een andere run), dan zou een gewone push geweigerd worden. Zet de
          # zojuist gegenereerde data opzij, ga naar de nieuwste main en zet
          # hem daarop terug: onze data is de nieuwste, de rest komt van main.
          tmp=$(mktemp -d)
          cp public/data/shows.json public/data/scrape-status.json public/data/theaters.json "$tmp/"
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          cp "$tmp/shows.json" "$tmp/scrape-status.json" "$tmp/theaters.json" public/data/
          git add public/data/shows.json public/data/scrape-status.json public/data/theaters.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de data — niets te committen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Ververs voorstellingsdata ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Een push met het ingebouwde GITHUB_TOKEN triggert bewust GEEN andere
      # workflows (GitHub voorkomt zo oneindige workflow-ketens). Daarom
      # starten we de deploy-workflow hier expliciet, in plaats van erop te
      # vertrouwen dat de push van hierboven 'm vanzelf aanzet.
      - name: Deploy-workflow triggeren
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml

      # Bewust de allerlaatste stap, ná commit en deploy: de data is dan al
      # bijgewerkt, maar de run wordt rood (en GitHub mailt) als er een theater
      # is teruggevallen op oude data of zonder vangnet faalde. Een "scherpe
      # daling"-waarschuwing of een echt lege agenda maakt de run niet rood.
      - name: Controleren op teruggevallen scrapers
        run: |
          failed=$(jq -r '.theaters | to_entries[] | select(.value.status == "terugval" or .value.status == "fout") | "\(.key): \(.value.status) — \(.value.fout)"' public/data/scrape-status.json)
          if [ -n "$failed" ]; then
            echo "::error title=Scraper(s) gefaald::$(echo "$failed" | wc -l | tr -d ' ') theater(s) teruggevallen of gefaald, zie hieronder en public/data/scrape-status.json"
            echo "$failed"
            exit 1
          fi
          echo "Alle theaters ok of leeg."
