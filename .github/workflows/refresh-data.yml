name: Refresh data

on:
  # De gewone start: de Cloud Function startNachtrun (functions/nachtrun.js)
  # doet om 05:00 Europe/Amsterdam een workflow_dispatch op main.
  workflow_dispatch:
    inputs:
      forceer:
        description: 'Ook verversen als de data vandaag al ververst is'
        type: boolean
        default: false
      alleen:
        description: 'Alleen deze theaters (id''s met komma, bv. mozaiek); de rest houdt zijn data. Telt als forceer.'
        type: string
        default: ''
  schedule:
    # Vangnet als de Cloud Function niet start. 03:17 UTC = 04:17 (winter) /
    # 05:17 (zomer) in Amsterdam. Bewust een scheve minuut: GitHub stelt
    # geplande runs op het hele uur vaak uren uit (de run van 04:00 begon op
    # 29 sep 2026 pas om 10:33). Is de data die dag al ververst, dan stopt
    # hij meteen (job "vandaag").
    - cron: '17 3 * * *'

# Nooit twee refreshes tegelijk (bv. een handmatige run terwijl de geplande
# nog loopt): de tweede zou anders bij de push falen op een verouderde
# checkout. Een lopende run wordt niet afgebroken; de nieuwe wacht.
# Komt er nog een bij terwijl er al een wacht, dan vervalt de wachtende
# (zo werkt een concurrency-groep); geen verlies, ze doen hetzelfde. Daarom
# gebruikt readme.yml een eigen groep.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write
  # Nodig om aan het eind de deploy-workflow te triggeren (zie onderaan).
  actions: write
  # Het issue "Nachtrun: aandacht nodig" (scripts/nachtrun-signalen.js).
  issues: write

jobs:
  # Is de data vandaag (Amsterdamse datum) al ververst? Dan niets doen: zo
  # geven de start om 05:00 en de cron samen hooguit één refresh per dag.
  # Een run die in de wachtrij stond (concurrency hierboven) kijkt pas als de
  # vorige klaar is, en ziet dan diens data op main.
  vandaag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      al_gedaan: ${{ steps.controle.outputs.al_gedaan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Vandaag al ververst?
        id: controle
        env:
          FORCEER: ${{ inputs.forceer == true || inputs.alleen != '' }}
        run: node scripts/refresh-vandaag.js

  refresh:
    needs: vandaag
    if: needs.vandaag.outputs.al_gedaan != 'true'
    runs-on: ubuntu-latest
    # Ruim boven de 80-minutengrens van "Nachtrun beoordelen" (die maakt de
    # run al rood bij een te lange scrape); 120 min sinds okt 2026 (was 90).
    timeout-minutes: 120
    steps:
      # ref: main in plaats van de commit waarop de run getriggerd werd: een
      # run die in de concurrency-wachtrij stond, moet de nieuwste main
      # uitchecken (inclusief de data van de run vóór hem), niet de SHA van
      # het moment dat hij werd aangemaakt.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Playwright's Chromium installeren
        run: npx playwright install --with-deps chromium

      # Faalt één theater (exception, timeout, of onverwacht 0 resultaten),
      # dan valt src/index.js terug op de vorige data van dat theater en
      # schrijft het de uitkomst per theater naar public/data/scrape-status.json.
      # Deze stap zelf slaagt dan gewoon, zodat de data altijd wordt bijgewerkt.
      - name: Agenda's scrapen
        id: scrape
        # Met `alleen` (handmatige run): alleen die theaters, via --only.
        # De duur gaat naar de beoordeling aan het eind (grens 80 min).
        run: |
          start=$(date +%s)
          node src/index.js ${ALLEEN:+--only=$ALLEEN}
          echo "SCRAPE_SECONDEN=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        env:
          ALLEEN: ${{ inputs.alleen }}
          # Contact-URL in de user-agent (publiek, dus een variabele, geen secret).
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}

      # src/index.js ontdubbelt al vóór het wegschrijven (src/lib/dedupe.js);
      # deze test bewaakt dat vangnet. Faalt hij, dan wordt er niets gecommit.
      - name: Controle op dubbele voorstellingen
        id: datacheck
        run: node --test test/dedupe.test.js

      - name: public/data (shows, scrape-status, theaters) en cache/detail committen en pushen
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Is main tijdens het scrapen verder gegaan (code-push, of data van
          # een andere run), dan zou een gewone push geweigerd worden. Zet de
          # zojuist gegenereerde data opzij, ga naar de nieuwste main en zet
          # hem daarop terug: onze data is de nieuwste, de rest komt van main.
          tmp=$(mktemp -d)
          cp public/data/shows.json public/data/scrape-status.json public/data/theaters.json "$tmp/"
          # Cache van detailpagina's tussen runs (src/lib/detailCache.js).
          if [ -d cache/detail ]; then cp -r cache/detail "$tmp/detail"; fi
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          cp "$tmp/shows.json" "$tmp/scrape-status.json" "$tmp/theaters.json" public/data/
          git add public/data/shows.json public/data/scrape-status.json public/data/theaters.json
          if [ -d "$tmp/detail" ]; then
            mkdir -p cache && rm -rf cache/detail && cp -r "$tmp/detail" cache/detail
            git add cache/detail
          fi
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de data — niets te committen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Ververs voorstellingsdata ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Een push met het ingebouwde GITHUB_TOKEN triggert bewust GEEN andere
      # workflows (GitHub voorkomt zo oneindige workflow-ketens). Daarom
      # starten we de deploy-workflow hier expliciet, in plaats van erop te
      # vertrouwen dat de push van hierboven 'm vanzelf aanzet.
      - name: Deploy-workflow triggeren
        id: deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml

      # Bewust de allerlaatste stap, ná commit en deploy, en altijd (ook na
      # een gefaalde stap). Rood alleen als er iets te doen is: een theater
      # 2+ nachten op rij teruggevallen, meer dan 3 in één nacht, een scherpe
      # daling 2+ nachten op rij, een gefaalde stap of een scrape van meer dan
      # 80 min. Eén nacht terugval (hooguit 3 theaters) of één nacht een
      # scherpe daling: groen met een waarschuwing.
      # Houdt het issue "Nachtrun: aandacht nodig" bij (aanmaken/bijwerken
      # bij rood, sluiten bij groen zonder terugval). Zie
      # src/lib/nachtrunSignalen.js en scripts/nachtrun-signalen.js.
      - name: Nachtrun beoordelen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STAP_SCRAPE: ${{ steps.scrape.outcome }}
          STAP_DATACHECK: ${{ steps.datacheck.outcome }}
          STAP_COMMIT: ${{ steps.commit.outcome }}
          STAP_DEPLOY: ${{ steps.deploy.outcome }}
        run: node scripts/nachtrun-signalen.js
